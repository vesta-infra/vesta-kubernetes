name: Build and Push Images

on:
  push:
    # develop is where work lands, so building only main meant ordinary pushes produced
    # no images at all and only tag builds were ever coherent.
    branches: [main, develop]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io/vesta-infra

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - component: operator
            image: kubernetes-operator
            context: operator
          - component: api
            image: kubernetes-api
            context: api
          - component: ui
            image: kubernetes-ui
            context: ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_COMMIT=${{ github.sha }}
            APP_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-helm:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set chart version
        run: |
          # Two different things, and conflating them is what broke non-tag builds.
          #
          # CHART_VERSION must be valid semver for Helm to accept the package.
          # APP_VERSION is what the deployments default their image tags to, so it MUST
          # name a tag the build job above actually pushed. On a branch build the images
          # are tagged with the short SHA, so that is what appVersion has to be -- the old
          # code wrote "0.0.0-<sha>" into both, producing a chart that pulled image tags
          # which had never existed.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            CHART_VERSION="${GITHUB_REF_NAME#v}"
            APP_VERSION="${CHART_VERSION}"
          else
            SHORT_SHA="$(echo ${GITHUB_SHA} | cut -c1-7)"
            CHART_VERSION="0.0.0-${GITHUB_REF_NAME//[^a-zA-Z0-9]/-}.${SHORT_SHA}"
            APP_VERSION="${SHORT_SHA}"
          fi
          echo "chart=${CHART_VERSION} app=${APP_VERSION}"
          sed -i "s|^version:.*|version: ${CHART_VERSION}|" deploy/helm/vesta/Chart.yaml
          sed -i "s|^appVersion:.*|appVersion: \"${APP_VERSION}\"|" deploy/helm/vesta/Chart.yaml

      - name: Lint and render the chart
        run: |
          helm lint deploy/helm/vesta
          helm template vesta deploy/helm/vesta -n vesta-system >/dev/null
          helm template vesta deploy/helm/vesta -n vesta-system --set postgres.enabled=true >/dev/null

      - name: Package Helm chart
        run: helm package deploy/helm/vesta

      - name: Push Helm chart
        run: helm push vesta-*.tgz oci://ghcr.io/vesta-infra/charts
