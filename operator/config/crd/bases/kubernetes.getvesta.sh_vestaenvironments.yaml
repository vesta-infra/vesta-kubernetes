---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: vestaenvironments.kubernetes.getvesta.sh
spec:
  group: kubernetes.getvesta.sh
  names:
    kind: VestaEnvironment
    listKind: VestaEnvironmentList
    plural: vestaenvironments
    shortNames:
    - ve
    - venv
    singular: vestaenvironment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.project
      name: Project
      type: string
    - jsonPath: .spec.order
      name: Order
      type: integer
    - jsonPath: .spec.branch
      name: Branch
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              autoDeploy:
                type: boolean
              autoDeployPRs:
                type: boolean
              branch:
                type: string
              displayName:
                type: string
              networkIsolation:
                description: |-
                  NetworkIsolation for this environment alone. Empty inherits the project's, then the
                  platform default.
                properties:
                  enabled:
                    description: |-
                      Enabled is a pointer so that a project turning isolation OFF is distinguishable from
                      a project that says nothing about it. With a plain bool the two are the same value
                      and the platform default would always win, which makes an exemption impossible to
                      express. Same reason QuotaSpec.Enforce is a pointer.
                    type: boolean
                  metricsPort:
                    description: |-
                      MetricsPort, when set, stays reachable from anywhere. A scraper that cannot be located
                      by namespace is common, and a closed metrics port fails silently -- the dashboard just
                      goes blank.
                    format: int32
                    type: integer
                  trustedNamespaceLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      TrustedNamespaceLabels is for clusters that label namespaces by purpose rather than
                      naming them predictably.
                    type: object
                  trustedNamespaces:
                    description: |-
                      TrustedNamespaces may reach apps. Left empty, a default list covering the usual
                      ingress-controller and monitoring namespaces is used; setting it REPLACES that list
                      rather than adding to it.
                    items:
                      type: string
                    type: array
                type: object
              order:
                type: integer
              project:
                type: string
              quota:
                description: |-
                  Quota bounds what this environment may consume. Empty inherits the project's, then
                  the platform default.
                properties:
                  defaultLimitCpu:
                    type: string
                  defaultLimitMemory:
                    type: string
                  defaultRequestCpu:
                    description: |-
                      Defaults for the LimitRange that ships alongside the quota. Once a quota names
                      requests.cpu, Kubernetes requires every new pod to set one; these are what pods that
                      do not get.
                    type: string
                  defaultRequestMemory:
                    type: string
                  enforce:
                    description: |-
                      Enforce is a pointer so absent is distinguishable from false. Absent means
                      report-only: the controller creates no ResourceQuota at all and only computes what
                      one would do.

                      That default is the whole safety story. A ResourceQuota is not applied retroactively
                      to pods that already exist -- it blocks the NEXT admission, which means the failure
                      lands in the middle of somebody's deploy rather than when the quota was set. Working
                      out the answer first, and showing it, turns that into a decision.
                    type: boolean
                  limitsCpu:
                    description: |-
                      Limits are opt-in and sharper than they look: a limits.* quota makes every pod
                      without that limit set unadmittable, and most pods do not set one.
                    type: string
                  limitsMemory:
                    type: string
                  maxDeployments:
                    format: int32
                    type: integer
                  maxPods:
                    format: int32
                    type: integer
                  maxPvcs:
                    format: int32
                    type: integer
                  maxServices:
                    format: int32
                    type: integer
                  requestsCpu:
                    type: string
                  requestsMemory:
                    type: string
                  storageTotal:
                    type: string
                type: object
              requireApproval:
                type: boolean
            required:
            - project
            type: object
          status:
            properties:
              appCount:
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              networkIsolation:
                description: |-
                  NetworkIsolation reports whether the environment is actually isolated, which is not
                  the same question as whether isolation was turned on.
                properties:
                  enabled:
                    type: boolean
                  enforced:
                    description: Enforced is whether this cluster's CNI is believed
                      to implement NetworkPolicy.
                    type: boolean
                  enforcementKnown:
                    description: |-
                      EnforcementKnown distinguishes "we determined it is not enforced" from "we could not
                      tell". Reporting an unknown as "not enforced" would cry wolf on every unrecognised
                      plugin; reporting it as enforced would be the dangerous direction.
                    type: boolean
                  lastApplied:
                    format: date-time
                    type: string
                  note:
                    type: string
                  policyCount:
                    format: int32
                    type: integer
                  trustedFrom:
                    items:
                      type: string
                    type: array
                type: object
              quota:
                description: Quota reports what the environment is consuming and whether
                  a quota is in force.
                properties:
                  committed:
                    additionalProperties:
                      type: string
                    description: |-
                      Committed is what the environment's apps add up to at their configured maximum --
                      autoscaling ceilings included, because a quota that fits today's replicas and not
                      tomorrow's blocks a scale-up with no warning.
                    type: object
                  enforced:
                    description: Enforced is whether a ResourceQuota object exists.
                    type: boolean
                  reason:
                    type: string
                  used:
                    additionalProperties:
                      type: string
                    description: Used is what is actually running now.
                    type: object
                  wouldExceed:
                    description: |-
                      WouldExceed is set when the configured quota is below what is already committed.
                      Applying it then would refuse the next deploy, so it is reported instead.
                    type: boolean
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
