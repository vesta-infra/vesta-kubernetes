---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: vestaaddons.kubernetes.getvesta.sh
spec:
  group: kubernetes.getvesta.sh
  names:
    kind: VestaAddon
    listKind: VestaAddonList
    plural: vestaaddons
    shortNames:
    - vad
    - addon
    singular: vestaaddon
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          VestaAddon is a managed datastore an app can bind to.

          spec.addons existed on VestaApp long before anything reconciled it: the API accepted the
          field, the CRD stored it, and no controller ever read it, so declaring an add-on did
          nothing at all. This is the kind that makes it real.

          It is a kind of its own rather than a slice on the app because its lifecycle is not the
          app's. A database outlives the app that first asked for it, its data must survive the
          app being deleted, and two apps may share one.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              deletionPolicy:
                description: |-
                  DeletionPolicy decides what happens to the data when this add-on is deleted. Empty
                  means Retain -- losing a database to a mistyped name is not something anyone should
                  have to opt out of.
                enum:
                - Retain
                - Delete
                type: string
              environment:
                description: |-
                  Environment limits the add-on to one environment of the project. Empty means every
                  environment gets its own instance, which is what keeps staging data out of
                  production.
                type: string
              project:
                type: string
              provider:
                description: |-
                  Provider decides who renders the add-on. "builtin" is a single-replica StatefulSet
                  Vesta manages itself.

                  Reserved rather than speculative: an operator-backed provider (CloudNativePG and the
                  like) changes what is rendered, not what is declared, so having the field from the
                  start means adding one later is not a schema change for every stored object.
                enum:
                - builtin
                type: string
              size:
                description: Size names a PodSizePreset, resolved the same way an
                  app's is.
                type: string
              storage:
                type: string
              storageClass:
                type: string
              type:
                enum:
                - postgres
                - mysql
                - redis
                - mongodb
                type: string
              version:
                type: string
            required:
            - project
            - type
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              namespaces:
                description: Namespaces lists where this add-on currently runs.
                items:
                  type: string
                type: array
              observedGeneration:
                format: int64
                type: integer
              phase:
                type: string
              ready:
                type: boolean
              reason:
                type: string
              retainedPVCs:
                description: |-
                  RetainedPVCs names claims left behind by a deletion under the Retain policy, so the
                  data can be found and reclaimed deliberately.
                items:
                  type: string
                type: array
              secretName:
                description: |-
                  SecretName is the Secret holding connection details, present in every namespace the
                  add-on was projected into.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
