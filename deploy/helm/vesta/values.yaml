# Vesta Helm Chart Values

# -- Operator configuration
operator:
  image:
    repository: ghcr.io/vesta-infra/kubernetes-operator
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  leaderElect: true

# -- API server configuration
api:
  image:
    repository: ghcr.io/vesta-infra/kubernetes-api
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8090
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ingress:
    enabled: false
    host: kubernetes.getvesta.sh
    tls: true
    clusterIssuer: letsencrypt-prod
    # -- IngressClass for this ingress. Defaults to config.ingressClassName.
    ingressClassName: ""
    annotations: {}
  # -- Database configuration
  database:
    # -- PostgreSQL connection string
    url: "postgres://vesta:vesta@localhost:5432/vesta?sslmode=disable"
    # -- Use an existing secret instead of creating one (set to secret name)
    existingSecret: ""
    # -- Key in the existing secret that contains the DATABASE_URL
    secretKey: "DATABASE_URL"
  # -- JWT session signing key. REQUIRED: the API refuses to start without one.
  # Must be at least 32 characters. Changing it signs every user out.
  jwt:
    # -- Signing key. Generate with: openssl rand -base64 48
    secret: ""
    # -- Use an existing secret instead of creating one (set to secret name)
    existingSecret: ""
    # -- Key in the existing secret that contains the JWT_SECRET
    secretKey: "JWT_SECRET"
  # -- Key encrypting reversible secrets at rest, currently TOTP shared secrets.
  # Generated automatically and reused across upgrades if left empty.
  # Losing or rotating it does not sign anyone out, but it does make every enrolled
  # authenticator app unverifiable -- those users fall back to their recovery codes.
  # Passkeys are unaffected; they need no key.
  encryption:
    # -- 32 raw bytes, base64-encoded. Generate with: openssl rand -base64 32
    key: ""
    # -- Use an existing secret instead of creating one (set to secret name)
    existingSecret: ""
    # -- Key in the existing secret that contains VESTA_ENCRYPTION_KEY
    secretKey: "VESTA_ENCRYPTION_KEY"
  # -- Security and session settings
  security:
    # -- Externally reachable base URL, used to build links in outbound email.
    # Never derived from request headers, which the caller controls.
    publicUrl: ""
    # -- Comma-separated CIDRs of proxies whose X-Forwarded-For may be trusted
    # (typically the ingress controller range). Empty trusts none, so client IPs
    # recorded in the audit log are the direct peer and cannot be forged.
    trustedProxies: ""
    # -- Comma-separated origins permitted to open log/exec WebSockets, in addition
    # to same-origin requests. Needed only when the UI and API are on different hosts.
    allowedOrigins: ""
  # -- GitHub App integration (optional, created via manifest flow in UI)
  github:
    # -- Pre-existing K8s Secret with GitHub App credentials (app-id, private-key, webhook-secret)
    existingSecret: ""

# -- UI configuration
ui:
  enabled: true
  image:
    repository: ghcr.io/vesta-infra/kubernetes-ui
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  ingress:
    enabled: false
    host: ui.getvesta.sh
    tls: true
    clusterIssuer: letsencrypt-prod
    # -- IngressClass for this ingress. Defaults to config.ingressClassName.
    ingressClassName: ""
    annotations: {}

# -- Vesta platform configuration (creates VestaConfig CRD)
config:
  domain: apps.getvesta.sh
  # -- Template for auto-generating per-environment domains.
  # Supports {{app}}, {{env}}, {{domain}} placeholders.
  # Example: "{{app}}-{{env}}.{{domain}}" → myapp-staging.apps.getvesta.sh
  domainTemplate: ""
  clusterIssuer: letsencrypt-prod
  ingressClassName: ""

  registry:
    build:
      url: ""
      credentialsSecret: ""
    globalImagePullSecrets: []

  podSizeList:
  - name: small
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  - name: medium
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  - name: large
    requests:
      cpu: "1000m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

  autoscaleDefaults:
    minReplicas: 1
    maxReplicas: 5
    targetCPU: 70
    targetMemory: 80

  auth:
    local:
      enabled: true
    oauth2:
      enabled: false
      providers: []
    apiTokens:
      enabled: true
      maxTokensPerUser: 10
      defaultExpiry: "90d"

# -- Service account
serviceAccount:
  create: true
  name: vesta-operator
  annotations: {}

# -- Namespace
namespace: vesta-system

# -- Image pull secrets for Vesta's own images
imagePullSecrets: []
