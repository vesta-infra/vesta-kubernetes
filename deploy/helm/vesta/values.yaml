# Vesta Helm Chart Values

# -- Operator configuration
operator:
  image:
    repository: ghcr.io/vesta-infra/kubernetes-operator
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  leaderElect: true

# -- API server configuration
api:
  image:
    repository: ghcr.io/vesta-infra/kubernetes-api
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8090
  # -- Readiness probe path.
  #
  # /readyz verifies the database and Kubernetes API are reachable, which is what makes a
  # bad upgrade fail safely: without it a new image that cannot reach Postgres still goes
  # Ready, the rollout completes, the old ReplicaSet scales to zero, and the component
  # that would roll back is the broken one.
  #
  # It only exists in API images from the release that introduced it. If you pin an older
  # api.image.tag, that image returns 404 here and the pod never becomes Ready -- set this
  # back to /healthz in that case.
  readinessPath: /readyz
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  ingress:
    enabled: false
    host: kubernetes.getvesta.sh
    tls: true
    clusterIssuer: letsencrypt-prod
    # -- IngressClass for this ingress. Defaults to config.ingressClassName.
    ingressClassName: ""
    annotations: {}
  # -- Database configuration
  database:
    # -- PostgreSQL connection string
    url: "postgres://vesta:vesta@localhost:5432/vesta?sslmode=disable"
    # -- Use an existing secret instead of creating one (set to secret name)
    existingSecret: ""
    # -- Key in the existing secret that contains the DATABASE_URL
    secretKey: "DATABASE_URL"
  # -- JWT session signing key. REQUIRED: the API refuses to start without one.
  # Must be at least 32 characters. Changing it signs every user out.
  jwt:
    # -- Signing key. Generate with: openssl rand -base64 48
    secret: ""
    # -- Use an existing secret instead of creating one (set to secret name)
    existingSecret: ""
    # -- Key in the existing secret that contains the JWT_SECRET
    secretKey: "JWT_SECRET"
  # -- Key encrypting reversible secrets at rest, currently TOTP shared secrets.
  # Generated automatically and reused across upgrades if left empty.
  # Losing or rotating it does not sign anyone out, but it does make every enrolled
  # authenticator app unverifiable -- those users fall back to their recovery codes.
  # Passkeys are unaffected; they need no key.
  encryption:
    # -- 32 raw bytes, base64-encoded. Generate with: openssl rand -base64 32
    key: ""
    # -- Use an existing secret instead of creating one (set to secret name)
    existingSecret: ""
    # -- Key in the existing secret that contains VESTA_ENCRYPTION_KEY
    secretKey: "VESTA_ENCRYPTION_KEY"
  # -- Security and session settings
  security:
    # -- Externally reachable base URL, used to build links in outbound email.
    # Never derived from request headers, which the caller controls.
    publicUrl: ""
    # -- Comma-separated CIDRs of proxies whose X-Forwarded-For may be trusted
    # (typically the ingress controller range). Empty trusts none, so client IPs
    # recorded in the audit log are the direct peer and cannot be forged.
    trustedProxies: ""
    # -- Comma-separated origins permitted to open log/exec WebSockets, in addition
    # to same-origin requests. Needed only when the UI and API are on different hosts.
    allowedOrigins: ""
  # -- GitHub App integration (optional, created via manifest flow in UI)
  github:
    # -- Pre-existing K8s Secret with GitHub App credentials (app-id, private-key, webhook-secret)
    existingSecret: ""

# -- UI configuration
ui:
  enabled: true
  image:
    repository: ghcr.io/vesta-infra/kubernetes-ui
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  ingress:
    enabled: false
    host: ui.getvesta.sh
    tls: true
    clusterIssuer: letsencrypt-prod
    # -- IngressClass for this ingress. Defaults to config.ingressClassName.
    ingressClassName: ""
    annotations: {}

# -- cert-manager integration. Vesta does not install cert-manager; it creates
# ClusterIssuers in an existing install (Settings -> SSL Certificates).
certManager:
  # -- Namespace cert-manager's controller runs in. Provider credential Secrets are
  # written here because that is where a ClusterIssuer's secretRefs are resolved — a
  # credential written anywhere else is simply not found, and the issuer sits Pending.
  namespace: cert-manager

# -- Vesta platform configuration (creates VestaConfig CRD)
config:
  domain: apps.getvesta.sh
  # -- Template for auto-generating per-environment domains.
  # Supports {{app}}, {{env}}, {{domain}} placeholders.
  # Example: "{{app}}-{{env}}.{{domain}}" → myapp-staging.apps.getvesta.sh
  domainTemplate: ""
  # -- Default cert-manager ClusterIssuer for apps that do not choose their own.
  # Left empty on purpose: this is now managed from Settings -> SSL Certificates, and the
  # vestaconfig template only renders the field when it is set — so an empty value here
  # means `helm upgrade` will not overwrite the default an admin chose in the UI. Set it
  # only to seed the value at install time on a cluster that already has an issuer.
  clusterIssuer: ""
  ingressClassName: ""

  registry:
    build:
      url: ""
      credentialsSecret: ""
    globalImagePullSecrets: []

  # Resource presets apps choose from. Must match defaultPodSizes in
  # api/internal/handlers/apps.go, which is what Vesta falls back to when no VestaConfig
  # exists -- otherwise the sizes on offer depend on whether one happens to be installed.
  #
  # The balanced sizes run about one core per gigabyte. The mem- sizes run about one core
  # per four, for workloads that hold far more in memory than they compute over.
  podSizeList:
    - name: xxsmall
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 100m, memory: 128Mi }
    - name: xsmall
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 250m, memory: 256Mi }
    - name: small
      requests: { cpu: 250m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
    - name: medium
      requests: { cpu: 500m, memory: 512Mi }
      limits: { cpu: "1", memory: 1Gi }
    - name: large
      requests: { cpu: "1", memory: 1Gi }
      limits: { cpu: "2", memory: 2Gi }
    - name: xlarge
      requests: { cpu: "2", memory: 2Gi }
      limits: { cpu: "4", memory: 4Gi }
    - name: mem-xsmall
      requests: { cpu: 62m, memory: 256Mi }
      limits: { cpu: 125m, memory: 512Mi }
    - name: mem-small
      requests: { cpu: 125m, memory: 512Mi }
      limits: { cpu: 250m, memory: 1Gi }
    - name: mem-medium
      requests: { cpu: 250m, memory: 1Gi }
      limits: { cpu: 500m, memory: 2Gi }
    - name: mem-large
      requests: { cpu: 500m, memory: 2Gi }
      limits: { cpu: "1", memory: 4Gi }
    - name: mem-xlarge
      requests: { cpu: "1", memory: 4Gi }
      limits: { cpu: "2", memory: 8Gi }
  autoscaleDefaults:
    minReplicas: 1
    maxReplicas: 5
    targetCPU: 70
    targetMemory: 80

  auth:
    local:
      enabled: true
    oauth2:
      enabled: false
      providers: []
    apiTokens:
      enabled: true
      maxTokensPerUser: 10
      defaultExpiry: "90d"

# -- Service account
serviceAccount:
  create: true
  name: vesta-operator
  annotations: {}

# -- Namespace
# -- Namespace is taken from the release (`helm -n <ns> --create-namespace`) rather than
# a value, so the two can never disagree. This key is no longer read; it is left
# documented here because `--reuse-values` will carry it forward from older installs.
# namespace: vesta-system

# -- CRD lifecycle. Helm applies a chart's crds/ directory once and never again, so Vesta
# applies its CRDs from a pre-install/pre-upgrade hook instead. Disable only if you manage
# CRDs yourself, and remember that a schema change then has to be applied by hand before
# the upgrade.
crdManagement:
  enabled: true
  timeoutSeconds: 300
  image:
    repository: registry.k8s.io/kubectl
    tag: "v1.31.3"
    pullPolicy: IfNotPresent

# -- Let an admin upgrade Vesta from the web UI.
#
# The upgrade runs `helm upgrade` in a Job, so Helm stays the source of truth and a later
# manual upgrade will not revert it. It needs a ServiceAccount broad enough to re-apply
# the whole chart, including RBAC and CRDs -- turn this off if you would rather upgrade
# from a terminal and not carry that account.
selfUpdate:
  enabled: true
  # -- Image the upgrade Job runs helm from. Override to a mirror for an air-gapped
  # cluster; the Job has no other way to obtain helm.
  helmImage: alpine/helm:3.16.3

# -- Optional bundled PostgreSQL, for evaluation and small installs.
#
# Off by default: a database inside the cluster is one you have to back up, upgrade and
# operate yourself, which is rarely what you want in production. When enabled it removes
# the manual secret step entirely -- DATABASE_URL is wired automatically and api.database
# is ignored.
postgres:
  enabled: false
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  database: vesta
  username: vesta
  # -- Leave empty to generate one on first install and reuse it on every upgrade.
  password: ""
  storage: 10Gi
  # -- Empty uses the cluster default StorageClass.
  storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# -- Image pull secrets for Vesta's own images
imagePullSecrets: []

# Log drains ship app logs to external destinations. Disabled by default: a cluster that
# already runs a logging agent should not get a second one tailing the same files.
logging:
  enabled: false
  image:
    repository: cr.fluentbit.io/fluent/fluent-bit
    tag: "3.1.9"
    pullPolicy: IfNotPresent
  # Sized for tailing, buffering and forwarding rather than for processing: the collector
  # holds at most a few MB of records per node before flushing.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  priorityClassName: ""
  # Credentials for drains, mounted as environment variables the generated config
  # references. Managed by the API when a drain is created through the UI; set by hand only
  # when declaring drains as YAML.
  #   - env: VESTA_DRAIN_CENTRAL_API_KEY
  #     secret: central-drain-credentials
  #     key: apiKey
  secretRefs: []

# Wake-on-traffic for scaled-to-zero apps.
#
# An activator stands in for a sleeping app: it holds the request, starts the app, waits for
# it to serve, and proxies through, so the requester sees a slow response rather than an
# error. One runs per namespace that contains an app with wakeOnTraffic set, created and
# removed by the operator.
#
# Enabled by default because the alternative is worse: without it a sleeping app's requests
# simply fail, and scale-to-zero is a feature nobody can use. Nothing runs until an app opts
# in, so a cluster that never uses it pays nothing.
# An in-cluster container registry, so a self-contained install needs no external one.
#
# A hostname is required when this is on, and the chart refuses to render without one. Images
# are pulled by the kubelet, which resolves through the node's DNS rather than the cluster's,
# so the in-cluster Service name is unreachable from the thing doing the pulling. It needs a
# real name and a certificate a node will trust.
containerRegistry:
  enabled: false
  ingress:
    # -- Required when enabled. The name apps will pull from, e.g. registry.example.com.
    host: ""
    # -- Defaults to config.ingressClassName.
    ingressClassName: ""
    annotations: {}
  image:
    repository: registry
    tag: "2"
    pullPolicy: IfNotPresent
  # -- Generated and remembered across upgrades when empty. Set only to adopt an existing one.
  username: vesta
  password: ""
  storage: 20Gi
  # -- Defaults to the cluster's default StorageClass.
  storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

activator:
  enabled: true
  image:
    repository: ghcr.io/vesta-infra/kubernetes-activator
    tag: ""
    pullPolicy: IfNotPresent
  # Sized for proxying, not for work: it holds connections and forwards bytes. An activator
  # that costs more than the app it stands in for defeats the point of scaling to zero.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
