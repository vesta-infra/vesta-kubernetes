apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vesta.fullname" . }}-operator
  labels:
    {{- include "vesta.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kubernetes.getvesta.sh"]
    resources: ["vestaapps", "vestaprojects", "vestaenvironments", "vestaconfigs", "vestasecrets", "vestamiddlewares", "vestalogdrains", "vestaaddons"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kubernetes.getvesta.sh"]
    resources: ["vestaapps/status", "vestaprojects/status", "vestaenvironments/status", "vestasecrets/status", "vestamiddlewares/status", "vestalogdrains/status", "vestaaddons/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["kubernetes.getvesta.sh"]
    resources: ["vestaapps/finalizers", "vestaaddons/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    # resourcequotas and limitranges: per-environment quotas. The LimitRange is not
    # optional -- once a quota names requests.cpu, Kubernetes refuses every pod that does
    # not set one, and the LimitRange is what supplies the default.
    resources: ["namespaces", "services", "secrets", "configmaps", "serviceaccounts", "persistentvolumeclaims", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["apps"]
    # statefulsets: managed add-ons run as one.
    resources: ["deployments", "daemonsets", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    # networkpolicies: per-environment isolation. Delete is load-bearing -- turning
    # isolation off has to REMOVE the default-deny, or every app in the environment stays
    # unreachable with no object left to explain why.
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["traefik.io"]
    resources: ["middlewares"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # SSL providers: the API creates and manages cert-manager ClusterIssuers on the admin's
  # behalf (Settings -> SSL Certificates). Certificates are read-only — cert-manager owns
  # them; Vesta only reports their status.
  - apiGroups: ["cert-manager.io"]
    resources: ["clusterissuers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch"]
  # Detect whether cert-manager is installed at all, so the UI can offer the install
  # instructions instead of a form that would silently produce nothing.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Creating the per-namespace activators: their identity, and the bindings that give it
  # the narrow permissions above. Escalation is bounded by Kubernetes itself -- a binding
  # can only grant what the binder already holds.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vesta.fullname" . }}-operator
  labels:
    {{- include "vesta.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vesta.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "vesta.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
