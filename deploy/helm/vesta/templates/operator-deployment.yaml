apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vesta.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vesta.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      {{- include "vesta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        {{- include "vesta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: {{ include "vesta.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: manager
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          args:
            {{- if .Values.operator.leaderElect }}
            - --leader-elect
            {{- end }}
          env:
            # Wake-on-traffic. Empty disables it: no activator is created, and a sleeping
            # app simply stays down rather than being answered by something that does not
            # exist.
            - name: VESTA_ACTIVATOR_IMAGE
              value: {{ if eq (include "vesta.enabled" (dict "Values" .Values "section" "activator" "default" true)) "true" }}"{{ include "vesta.activatorImage" . }}"{{ else }}""{{ end }}
            - name: VESTA_ACTIVATOR_NAMESPACE_ROLE
              value: {{ include "vesta.fullname" . }}-activator-namespace
            - name: VESTA_ACTIVATOR_WAKE_ROLE
              value: {{ include "vesta.fullname" . }}-activator-wake
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
            - containerPort: 8081
              name: health
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
