{{- if not .Values.api.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vesta.fullname" . }}-api-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vesta.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.api.database.url | quote }}
{{- end }}
{{- if not .Values.api.jwt.existingSecret }}
{{- $name := printf "%s-api-jwt" (include "vesta.fullname" .) }}
{{- /*
  Reuse the key that is already installed, if any. Helm's randAlphaNum runs again on
  every render, so generating unconditionally would mint a new key on each `helm upgrade`
  and sign every user out. Caveat: `lookup` returns nothing under `helm template` and
  `--dry-run`, so a `helm template | kubectl apply` pipeline still rotates the key - set
  api.jwt.secret explicitly if that is your workflow.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $jwt := .Values.api.jwt.secret }}
{{- if not $jwt }}
  {{- if and $existing (index $existing.data "JWT_SECRET") }}
    {{- $jwt = index $existing.data "JWT_SECRET" | b64dec }}
  {{- else }}
    {{- $jwt = randAlphaNum 48 }}
  {{- end }}
{{- end }}
{{- if lt (len $jwt) 32 }}
  {{- fail "api.jwt.secret must be at least 32 characters" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vesta.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
type: Opaque
stringData:
  JWT_SECRET: {{ $jwt | quote }}
{{- end }}
{{- if not .Values.api.encryption.existingSecret }}
{{- $encName := printf "%s-api-encryption" (include "vesta.fullname" .) }}
{{- /*
  Same reuse-or-generate dance as JWT_SECRET above, and for a sharper reason: rotating
  this key does not sign users out, it makes every enrolled TOTP secret undecryptable.
  Users would keep their authenticator app and simply stop being able to log in with it,
  falling back to recovery codes. See the caveat there about `helm template`.
*/}}
{{- $existingEnc := lookup "v1" "Secret" .Release.Namespace $encName }}
{{- $enc := .Values.api.encryption.key }}
{{- if not $enc }}
  {{- if and $existingEnc (index $existingEnc.data "VESTA_ENCRYPTION_KEY") }}
    {{- $enc = index $existingEnc.data "VESTA_ENCRYPTION_KEY" | b64dec }}
  {{- else }}
    {{- /* 32 raw bytes, base64-encoded: the AES-256 key crypto.NewCipherFromBase64 expects. */}}
    {{- $enc = randBytes 32 }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $encName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vesta.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
type: Opaque
stringData:
  VESTA_ENCRYPTION_KEY: {{ $enc | quote }}
{{- end }}
