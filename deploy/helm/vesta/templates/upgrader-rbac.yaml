{{- if eq (include "vesta.enabled" (dict "Values" .Values "section" "selfUpdate" "default" true)) "true" }}
{{- /*
The identity the in-cluster `helm upgrade` Job runs as.

Separate from the ServiceAccount the API and operator share, even though that one is
already broad enough. Keeping it separate means the permissions an upgrade needs are
written down in one place and can be revoked by turning selfUpdate off, rather than being
invisibly folded into the account every request already runs as.

The permissions are genuinely wide -- helm re-applies every manifest in the chart, which
includes ClusterRoles and CRDs -- and that is the honest cost of letting the platform
upgrade itself. An install that would rather not carry it can set selfUpdate.enabled=false
and upgrade with helm from a terminal.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-upgrader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vesta.labels" . | nindent 4 }}
    app.kubernetes.io/component: upgrader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-upgrader
  labels:
    {{- include "vesta.labels" . | nindent 4 }}
    app.kubernetes.io/component: upgrader
rules:
  # Every verb the chart's own resources need, delete included: hooks are annotated
  # helm.sh/hook-delete-policy: before-hook-creation, so Helm deletes the previous run's
  # objects before recreating them. A role without delete fails the pre-upgrade hook and
  # the upgrade never starts.
  #
  # Helm stores release state as Secrets in the release namespace.
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services", "serviceaccounts", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The chart renders the release Namespace. Deliberately no delete: nothing an upgrade
  # does should be able to remove the namespace, which is what 0.7.0 achieved by other
  # means.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Read-only, and not because the chart renders these. `helm upgrade --wait` computes
  # readiness by walking from a Deployment to its ReplicaSets to their Pods, and from a
  # Service to its Endpoints. Without these it fails partway through the wait -- after the
  # manifests have already been applied, which is the worst moment to stop.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "endpoints", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["kubernetes.getvesta.sh"]
    resources: ["vestaconfigs"]
    verbs: ["get", "list", "create", "update", "patch"]
  # vestasecrets: the in-cluster registry registers itself as an ordinary Vesta credential,
  # so enabling it makes the chart render one. Without this, self-update fails partway
  # through with a forbidden error on any cluster with the registry turned on.
  #
  # delete is included, unlike vestaconfigs: turning the registry off has to take its
  # credential with it, or apps are left pointing at a registry that no longer exists. Helm
  # only deletes what it rendered itself, so a credential someone created by hand is not in
  # reach of this.
  - apiGroups: ["kubernetes.getvesta.sh"]
    resources: ["vestasecrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Re-applying the chart re-applies the platform's own RBAC. delete is required because
  # the CRD hook's ClusterRole is recreated on every upgrade under before-hook-creation.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "bind", "escalate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-upgrader
  labels:
    {{- include "vesta.labels" . | nindent 4 }}
    app.kubernetes.io/component: upgrader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-upgrader
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-upgrader
    namespace: {{ .Release.Namespace }}
{{- end }}
