# Scaffolding for the log collector, rendered always.
#
# These four objects cost nothing to have and run nothing: a ServiceAccount, the ClusterRole
# that lets Fluent Bit read pod metadata, its binding, and a Service for the metrics port.
# Rendering them unconditionally is what lets the OPERATOR create the DaemonSet when a drain
# is configured, without needing the power to mint cluster roles — an operator that can
# grant cluster-wide permissions is a much larger thing to trust than one that can run a
# DaemonSet.
#
# Before this, configuring a drain in the UI wrote a configuration and produced no collector
# to run it, and finishing the job meant a helm upgrade from a terminal.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vesta-logs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vesta.labels" . | nindent 4 }}
    app.kubernetes.io/component: logs
---
# Its own ClusterRole rather than the operator's. The collector needs only to read pod
# metadata for the kubernetes filter, and the operator's role is broad enough that reusing
# it would hand every node a token that can write workloads.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-logs
  labels:
    {{- include "vesta.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-logs
  labels:
    {{- include "vesta.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-logs
subjects:
  - kind: ServiceAccount
    name: vesta-logs
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: vesta-logs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vesta.labels" . | nindent 4 }}
    app.kubernetes.io/component: logs
spec:
  # Headless: the operator scrapes the metrics of whichever pod answers, and the numbers
  # are per-node anyway. A load-balanced VIP would give a different node each poll and make
  # the reported counters jump around.
  clusterIP: None
  selector:
    app.kubernetes.io/name: vesta-logs
  ports:
    - name: metrics
      port: 2020
      targetPort: 2020
{{- if eq (include "vesta.enabled" (dict "Values" .Values "section" "logging" "default" false)) "true" }}
---
# Rendered only when explicitly enabled, which keeps an install that already sets
# logging.enabled=true working exactly as before, with Helm owning the DaemonSet. Left off,
# the operator creates and removes one as drains come and go, and never touches this one:
# it checks the managed-by label before deleting anything.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vesta-logs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vesta.labels" . | nindent 4 }}
    app.kubernetes.io/component: logs
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vesta-logs
  template:
    metadata:
      labels:
        {{- include "vesta.labels" . | nindent 8 }}
        app.kubernetes.io/name: vesta-logs
        app.kubernetes.io/component: logs
      annotations:
        # Stamped by the operator with the hash of the generated configuration. Changing a
        # drain rolls this DaemonSet; Helm leaves the value alone on upgrade.
        checksum/config: "pending"
    spec:
      serviceAccountName: vesta-logs
      # Logs must keep flowing while a node is draining or tainted, which is exactly when
      # the interesting ones are produced.
      tolerations:
        - operator: Exists
      priorityClassName: {{ .Values.logging.priorityClassName | default "" | quote }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: fluent-bit
          image: "{{ .Values.logging.image.repository }}:{{ .Values.logging.image.tag }}"
          imagePullPolicy: {{ .Values.logging.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 2020
          env:
            {{- range .Values.logging.secretRefs }}
            - name: {{ .env }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secret }}
                  key: {{ .key }}
            {{- end }}
          resources:
            {{- toYaml .Values.logging.resources | nindent 12 }}
          securityContext:
            # The container log files are root-owned on the node, so reading them needs
            # root; everything else is dropped.
            runAsUser: 0
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/
            # Read-only, and it must stay that way: a logging agent that can write to the
            # node's log directory can corrupt what every other agent reads.
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            # Top level, not under /var/log: that is a read-only bind mount from the
            # host and runc cannot create a mountpoint inside one, so the container
            # never starts.
            - name: storage
              mountPath: /flb-storage
          livenessProbe:
            httpGet:
              path: /
              port: 2020
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 2020
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: vesta-logs-config
            optional: true
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: storage
          emptyDir: {}
{{- end }}
