apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vesta.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vesta.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "vesta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        # Changing a secret value rewrites the Secret but rolls nothing; this makes the
        # pod template change with it so the new value is actually picked up.
        checksum/secrets: {{ include (print $.Template.BasePath "/api-secret.yaml") . | sha256sum }}
      labels:
        {{- include "vesta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "vesta.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: "{{ .Values.api.port }}"
            # Self-update needs to know which release and namespace it belongs to.
            # Deployment names are "<release>-api", so an install named anything other
            # than "vesta" would otherwise be upgraded under the wrong release name and
            # quietly create a second one.
            - name: VESTA_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: VESTA_RELEASE_NAME
              value: {{ .Release.Name | quote }}
            {{- if .Values.selfUpdate.enabled }}
            - name: VESTA_HELM_IMAGE
              value: {{ .Values.selfUpdate.helmImage | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  {{- if .Values.postgres.enabled }}
                  {{- /* The bundled database owns the URL, so api.database is ignored. */}}
                  name: {{ include "vesta.fullname" . }}-postgres
                  key: DATABASE_URL
                  {{- else }}
                  name: {{ .Values.api.database.existingSecret | default (printf "%s-api-db" (include "vesta.fullname" .)) }}
                  key: {{ .Values.api.database.secretKey | default "DATABASE_URL" }}
                  {{- end }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.jwt.existingSecret | default (printf "%s-api-jwt" (include "vesta.fullname" .)) }}
                  key: {{ .Values.api.jwt.secretKey | default "JWT_SECRET" }}
            - name: VESTA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.encryption.existingSecret | default (printf "%s-api-encryption" (include "vesta.fullname" .)) }}
                  key: {{ .Values.api.encryption.secretKey | default "VESTA_ENCRYPTION_KEY" }}
            # cert-manager resolves a ClusterIssuer's secretRefs against its own controller
            # namespace, so SSL provider credentials must be written there, not here.
            - name: CERT_MANAGER_NAMESPACE
              value: {{ .Values.certManager.namespace | quote }}
            {{- with .Values.api.security.publicUrl }}
            - name: VESTA_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.security.trustedProxies }}
            - name: VESTA_TRUSTED_PROXIES
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.api.security.allowedOrigins }}
            - name: VESTA_ALLOWED_ORIGINS
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.api.github.existingSecret }}
            - name: GITHUB_APP_SECRET
              value: {{ .Values.api.github.existingSecret | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: {{ .Values.api.readinessPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vesta.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vesta.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "vesta.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
