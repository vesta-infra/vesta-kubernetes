apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vestaapps.kubernetes.getvesta.sh
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: kubernetes.getvesta.sh
  names:
    kind: VestaApp
    listKind: VestaAppList
    plural: vestaapps
    singular: vestaapp
    shortNames:
    - va
    - vapp
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Reason
      type: string
      jsonPath: .status.reason
    - name: URL
      type: string
      jsonPath: .status.url
    - name: Image
      type: string
      jsonPath: .status.currentImage
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        description: VestaApp is the primary resource representing a deployed application.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - project
            - runtime
            properties:
              project:
                type: string
                description: Name of the VestaProject this app belongs to.
              environments:
                type: array
                description: Per-environment deployment configuration.
                items:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
                      description: Environment name (must exist in project.spec.environments).
                    replicas:
                      type: integer
                      format: int32
                      minimum: 0
                      description: Number of replicas for this environment.
                    autoscale:
                      type: object
                      description: Autoscaling configuration for this environment.
                      properties:
                        enabled:
                          type: boolean
                        minReplicas:
                          type: integer
                          format: int32
                          minimum: 0
                        maxReplicas:
                          type: integer
                          format: int32
                          minimum: 1
                        metrics:
                          type: array
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                                enum:
                                - cpu
                                - memory
                                - custom
                              name:
                                type: string
                              targetAverageUtilization:
                                type: integer
                                format: int32
                              targetAverageValue:
                                type: string
                            required:
                            - type
                        behavior:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                          properties:
                            scaleDown:
                              description: 'scaleDown is scaling policy for scaling
                                Down.

                                If not set, the default value is to allow to scale
                                down to minReplicas pods, with a

                                300 second stabilization window (i.e., the highest
                                recommendation for

                                the last 300sec is used).'
                              properties:
                                policies:
                                  description: 'policies is a list of potential scaling
                                    polices which can be used during scaling.

                                    If not set, use the default values:

                                    - For scale up: allow doubling the number of pods,
                                    or an absolute change of 4 pods in a 15s window.

                                    - For scale down: allow all pods to be removed
                                    in a 15s window.'
                                  items:
                                    description: HPAScalingPolicy is a single policy
                                      which must hold true for a specified past interval.
                                    properties:
                                      periodSeconds:
                                        description: 'periodSeconds specifies the
                                          window of time for which the policy should
                                          hold true.

                                          PeriodSeconds must be greater than zero
                                          and less than or equal to 1800 (30 min).'
                                        format: int32
                                        type: integer
                                      type:
                                        description: type is used to specify the scaling
                                          policy.
                                        type: string
                                      value:
                                        description: 'value contains the amount of
                                          change which is permitted by the policy.

                                          It must be greater than zero'
                                        format: int32
                                        type: integer
                                    type: object
                                  type: array
                                  x-kubernetes-list-type: atomic
                                selectPolicy:
                                  description: 'selectPolicy is used to specify which
                                    policy should be used.

                                    If not set, the default value Max is used.'
                                  type: string
                                stabilizationWindowSeconds:
                                  description: 'stabilizationWindowSeconds is the
                                    number of seconds for which past recommendations
                                    should be

                                    considered while scaling up or scaling down.

                                    StabilizationWindowSeconds must be greater than
                                    or equal to zero and less than or equal to 3600
                                    (one hour).

                                    If not set, use the default values:

                                    - For scale up: 0 (i.e. no stabilization is done).

                                    - For scale down: 300 (i.e. the stabilization
                                    window is 300 seconds long).'
                                  format: int32
                                  type: integer
                                tolerance:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  description: 'tolerance is the tolerance on the
                                    ratio between the current and desired

                                    metric value under which no updates are made to
                                    the desired number of

                                    replicas (e.g. 0.01 for 1%). Must be greater than
                                    or equal to zero. If not

                                    set, the default cluster-wide tolerance is applied
                                    (by default 10%).


                                    For example, if autoscaling is configured with
                                    a memory consumption target of 100Mi,

                                    and scale-down and scale-up tolerances of 5% and
                                    1% respectively, scaling will be

                                    triggered when the actual consumption falls below
                                    95Mi or exceeds 101Mi.


                                    This is an beta field and requires the HPAConfigurableTolerance
                                    feature

                                    gate to be enabled.'
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
                              type: object
                            scaleUp:
                              description: "scaleUp is scaling policy for scaling\
                                \ Up.\nIf not set, the default value is the higher\
                                \ of:\n  * increase no more than 4 pods per 60 seconds\n\
                                \  * double the number of pods per 60 seconds\nNo\
                                \ stabilization is used."
                              properties:
                                policies:
                                  description: 'policies is a list of potential scaling
                                    polices which can be used during scaling.

                                    If not set, use the default values:

                                    - For scale up: allow doubling the number of pods,
                                    or an absolute change of 4 pods in a 15s window.

                                    - For scale down: allow all pods to be removed
                                    in a 15s window.'
                                  items:
                                    description: HPAScalingPolicy is a single policy
                                      which must hold true for a specified past interval.
                                    properties:
                                      periodSeconds:
                                        description: 'periodSeconds specifies the
                                          window of time for which the policy should
                                          hold true.

                                          PeriodSeconds must be greater than zero
                                          and less than or equal to 1800 (30 min).'
                                        format: int32
                                        type: integer
                                      type:
                                        description: type is used to specify the scaling
                                          policy.
                                        type: string
                                      value:
                                        description: 'value contains the amount of
                                          change which is permitted by the policy.

                                          It must be greater than zero'
                                        format: int32
                                        type: integer
                                    type: object
                                  type: array
                                  x-kubernetes-list-type: atomic
                                selectPolicy:
                                  description: 'selectPolicy is used to specify which
                                    policy should be used.

                                    If not set, the default value Max is used.'
                                  type: string
                                stabilizationWindowSeconds:
                                  description: 'stabilizationWindowSeconds is the
                                    number of seconds for which past recommendations
                                    should be

                                    considered while scaling up or scaling down.

                                    StabilizationWindowSeconds must be greater than
                                    or equal to zero and less than or equal to 3600
                                    (one hour).

                                    If not set, use the default values:

                                    - For scale up: 0 (i.e. no stabilization is done).

                                    - For scale down: 300 (i.e. the stabilization
                                    window is 300 seconds long).'
                                  format: int32
                                  type: integer
                                tolerance:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  description: 'tolerance is the tolerance on the
                                    ratio between the current and desired

                                    metric value under which no updates are made to
                                    the desired number of

                                    replicas (e.g. 0.01 for 1%). Must be greater than
                                    or equal to zero. If not

                                    set, the default cluster-wide tolerance is applied
                                    (by default 10%).


                                    For example, if autoscaling is configured with
                                    a memory consumption target of 100Mi,

                                    and scale-down and scale-up tolerances of 5% and
                                    1% respectively, scaling will be

                                    triggered when the actual consumption falls below
                                    95Mi or exceeds 101Mi.


                                    This is an beta field and requires the HPAConfigurableTolerance
                                    feature

                                    gate to be enabled.'
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
                              type: object
                      required:
                      - enabled
                      - maxReplicas
                    resources:
                      type: object
                      description: Per-environment resource override.
                      properties:
                        size:
                          type: string
                        requests:
                          type: object
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            x-kubernetes-int-or-string: true
                        limits:
                          type: object
                          additionalProperties:
                            anyOf:
                            - type: integer
                            - type: string
                            x-kubernetes-int-or-string: true
                    image:
                      type: object
                      description: Per-environment image override.
                      properties:
                        repository:
                          type: string
                        tag:
                          type: string
                        pullPolicy:
                          type: string
                          enum:
                          - Always
                          - Never
                          - IfNotPresent
                        imagePullSecrets:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                            required:
                            - name
                    imagePullSecrets:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                        required:
                        - name
                    ingress:
                      type: object
                      description: Per-environment ingress override.
                      properties:
                        domain:
                          type: string
                          description: Custom domain for this environment. Overrides
                            app-level domain and domain template.
                        domains:
                          type: array
                          description: Multiple custom domains for this environment.
                            Takes precedence over single domain field.
                          items:
                            type: string
                        tls:
                          type: boolean
                          description: Enable or disable TLS for this environment.
                            Overrides app-level TLS setting.
                        annotations:
                          type: object
                          description: Per-environment ingress annotations (e.g.,
                            rate limiting). Merged after app-level annotations.
                          additionalProperties:
                            type: string
                        redirectDomains:
                          type: array
                          description: Domains that 301-redirect to the primary domain
                            for this environment.
                          items:
                            type: string
                        redirectTarget:
                          type: string
                          description: Explicit target domain for redirects in this
                            environment. If omitted, redirects go to the first entry
                            in domains.
                        clusterIssuer:
                          description: 'ClusterIssuer selects the certificate provider
                            for this environment only, so

                            staging can issue from a staging ACME endpoint while production
                            does not.

                            Empty inherits the app-level issuer.'
                          type: string
                        tlsMode:
                          description: TLSMode is empty for normal issuer resolution.
                            See IngressConfig.TLSMode.
                          enum:
                          - manual
                          - custom-annotations
                          type: string
                        tlsSecretName:
                          description: 'TLSSecretName points the Ingress at a certificate
                            the user supplied rather than

                            one cert-manager issues. Empty uses the generated "<app>-<env>-tls"
                            name.'
                          type: string
                        middlewares:
                          description: 'Middlewares replaces the app-level list for
                            this environment. It is a pointer so

                            that an empty list is distinguishable from an absent one:
                            nil inherits the

                            app-level middlewares, [] applies none, which is how an
                            environment opts out of a

                            platform-wide allowList without the app having to stop
                            declaring it.'
                          items:
                            type: string
                          type: array
                    service:
                      type: object
                      description: Per-environment service override.
                      properties:
                        type:
                          type: string
                          enum:
                          - ClusterIP
                          - NodePort
                          - LoadBalancer
                        ports:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              port:
                                type: integer
                                format: int32
                                minimum: 1
                                maximum: 65535
                              targetPort:
                                type: integer
                                format: int32
                                minimum: 1
                                maximum: 65535
                              protocol:
                                type: string
                                enum:
                                - TCP
                                - UDP
                                - SCTP
                                default: TCP
                              nodePort:
                                type: integer
                                format: int32
                                minimum: 30000
                                maximum: 32767
                                description: NodePort number (only for NodePort/LoadBalancer
                                  type).
                            required:
                            - name
                            - port
              git:
                type: object
                description: Git source configuration.
                properties:
                  provider:
                    type: string
                    enum:
                    - github
                    - gitlab
                    - bitbucket
                    - gitea
                  repository:
                    type: string
                  branch:
                    type: string
                  autoDeployOnPush:
                    type: boolean
                    default: false
                  connectionId:
                    description: 'ConnectionID names the git connection that serves
                      this repository, set when the

                      repository is chosen through the UI. Empty is resolved by matching
                      provider, host

                      and path against the configured connections, which is what keeps
                      apps written

                      before connections existed working.'
                    type: string
                  host:
                    description: 'Host is the git server, for self-managed GitLab
                      and Bitbucket Data Center. Empty

                      means the provider''s SaaS host. It is part of a repository''s
                      identity: the same

                      path can exist on gitlab.com and on gitlab.internal and they
                      are not the same

                      repository.'
                    type: string
                  tokenSecret:
                    description: 'TokenSecret names a Secret in vesta-system holding
                      a "token" key, used instead of a

                      connection''s credentials.


                      This field is new here but not new to the codebase: the API
                      has been reading it and

                      the UI collecting it since before it existed on the type. Because
                      the CRD is a

                      structural schema with no preserved unknown fields, the API
                      server pruned it on

                      every write, so the read could never succeed and the input was
                      decorative. Same for

                      commitSHA, which is not restored here -- it was observed state
                      and belongs in

                      status.lastCommitSHA, which already exists.'
                    type: string
                required:
                - provider
                - repository
              build:
                type: object
                description: Build strategy configuration.
                properties:
                  strategy:
                    type: string
                    enum:
                    - runpacks
                    - buildpacks
                    - dockerfile
                    - nixpacks
                    - image
                  dockerfile:
                    type: string
                    description: Path to Dockerfile, only used when strategy=dockerfile.
                required:
                - strategy
              image:
                type: object
                description: Image configuration for deploying from a registry.
                properties:
                  repository:
                    type: string
                    description: Full image repository path (e.g. registry.example.com/org/app).
                  tag:
                    type: string
                    description: Image tag. Updated by the deploy endpoint.
                  pullPolicy:
                    type: string
                    enum:
                    - Always
                    - IfNotPresent
                    - Never
                    default: IfNotPresent
                  imagePullSecrets:
                    type: array
                    description: References to Secrets of type kubernetes.io/dockerconfigjson.
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                      required:
                      - name
                required:
                - repository
              runtime:
                type: object
                description: Runtime configuration for the application container.
                properties:
                  port:
                    type: integer
                    format: int32
                    minimum: 0
                    maximum: 65535
                  command:
                    type: string
                  args:
                    type: array
                    items:
                      type: string
                  env:
                    type: array
                    description: Non-sensitive environment variables only.
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        value:
                          type: string
                        valueFrom:
                          description: Source for the environment variable's value.
                            Cannot be used if value is not empty.
                          properties:
                            configMapKeyRef:
                              description: Selects a key of a ConfigMap.
                              properties:
                                key:
                                  description: The key to select.
                                  type: string
                                name:
                                  default: ''
                                  description: 'Name of the referent.

                                    This field is effectively required, but due to
                                    backwards compatibility is

                                    allowed to be empty. Instances of this type with
                                    an empty value here are

                                    almost certainly wrong.

                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names'
                                  type: string
                                optional:
                                  description: Specify whether the ConfigMap or its
                                    key must be defined
                                  type: boolean
                              type: object
                              x-kubernetes-map-type: atomic
                            fieldRef:
                              description: 'Selects a field of the pod: supports metadata.name,
                                metadata.namespace, `metadata.labels[''<KEY>'']`,
                                `metadata.annotations[''<KEY>'']`,

                                spec.nodeName, spec.serviceAccountName, status.hostIP,
                                status.podIP, status.podIPs.'
                              properties:
                                apiVersion:
                                  description: Version of the schema the FieldPath
                                    is written in terms of, defaults to "v1".
                                  type: string
                                fieldPath:
                                  description: Path of the field to select in the
                                    specified API version.
                                  type: string
                              type: object
                              x-kubernetes-map-type: atomic
                            fileKeyRef:
                              description: 'FileKeyRef selects a key of the env file.

                                Requires the EnvFiles feature gate to be enabled.'
                              properties:
                                key:
                                  description: 'The key within the env file. An invalid
                                    key will prevent the pod from starting.

                                    The keys defined within a source may consist of
                                    any printable ASCII characters except ''=''.

                                    During Alpha stage of the EnvFiles feature gate,
                                    the key size is limited to 128 characters.'
                                  type: string
                                optional:
                                  default: false
                                  description: 'Specify whether the file or its key
                                    must be defined. If the file or key

                                    does not exist, then the env var is not published.

                                    If optional is set to true and the specified key
                                    does not exist,

                                    the environment variable will not be set in the
                                    Pod''s containers.


                                    If optional is set to false and the specified
                                    key does not exist,

                                    an error will be returned during Pod creation.'
                                  type: boolean
                                path:
                                  description: 'The path within the volume from which
                                    to select the file.

                                    Must be relative and may not contain the ''..''
                                    path or start with ''..''.'
                                  type: string
                                volumeName:
                                  description: The name of the volume mount containing
                                    the env file.
                                  type: string
                              type: object
                              x-kubernetes-map-type: atomic
                            resourceFieldRef:
                              description: 'Selects a resource of the container: only
                                resources limits and requests

                                (limits.cpu, limits.memory, limits.ephemeral-storage,
                                requests.cpu, requests.memory and requests.ephemeral-storage)
                                are currently supported.'
                              properties:
                                containerName:
                                  description: 'Container name: required for volumes,
                                    optional for env vars'
                                  type: string
                                divisor:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  description: Specifies the output format of the
                                    exposed resources, defaults to "1"
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
                                resource:
                                  description: 'Required: resource to select'
                                  type: string
                              type: object
                              x-kubernetes-map-type: atomic
                            secretKeyRef:
                              description: Selects a key of a secret in the pod's
                                namespace
                              properties:
                                key:
                                  description: The key of the secret to select from.  Must
                                    be a valid secret key.
                                  type: string
                                name:
                                  default: ''
                                  description: 'Name of the referent.

                                    This field is effectively required, but due to
                                    backwards compatibility is

                                    allowed to be empty. Instances of this type with
                                    an empty value here are

                                    almost certainly wrong.

                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names'
                                  type: string
                                optional:
                                  description: Specify whether the Secret or its key
                                    must be defined
                                  type: boolean
                              type: object
                              x-kubernetes-map-type: atomic
                          type: object
                      required:
                      - name
                      - value
                  secrets:
                    type: array
                    description: Secret bindings -- all sensitive config goes here.
                    items:
                      type: object
                      properties:
                        secretRef:
                          type: object
                          properties:
                            name:
                              type: string
                          required:
                          - name
                        secretKeyRef:
                          type: object
                          properties:
                            name:
                              type: string
                            key:
                              type: string
                            envVar:
                              type: string
                          required:
                          - name
                          - key
                          - envVar
                        secretMount:
                          type: object
                          properties:
                            name:
                              type: string
                            mountPath:
                              type: string
                            readOnly:
                              type: boolean
                              default: true
                          required:
                          - name
                          - mountPath
                        keys:
                          type: array
                          items:
                            type: object
                            properties:
                              secretKey:
                                type: string
                              envVar:
                                type: string
                            required:
                            - secretKey
                            - envVar
                        environments:
                          description: Environments limits this binding to specific
                            environments. Empty means all environments.
                          items:
                            type: string
                          type: array
                  volumes:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        mountPath:
                          type: string
                        persistentVolumeClaim:
                          type: object
                          properties:
                            claimName:
                              type: string
                            size:
                              type: string
                              description: Storage size for the PVC (e.g. 1Gi, 5Gi,
                                10Gi). Defaults to 1Gi.
                          required:
                          - claimName
                      required:
                      - name
                      - mountPath
              service:
                type: object
                description: Service configuration for exposing the app. Overrides
                  runtime.port when set.
                properties:
                  type:
                    type: string
                    enum:
                    - ClusterIP
                    - NodePort
                    - LoadBalancer
                    default: ClusterIP
                    description: Kubernetes Service type.
                  ports:
                    type: array
                    description: Ports to expose on the Service.
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Port name (e.g. http, grpc).
                        port:
                          type: integer
                          format: int32
                          minimum: 1
                          maximum: 65535
                          description: Service port number.
                        targetPort:
                          type: integer
                          format: int32
                          minimum: 1
                          maximum: 65535
                          description: Container port. Defaults to port if omitted.
                        protocol:
                          type: string
                          enum:
                          - TCP
                          - UDP
                          - SCTP
                          default: TCP
                        nodePort:
                          type: integer
                          format: int32
                          minimum: 30000
                          maximum: 32767
                          description: NodePort number (only for NodePort/LoadBalancer
                            type).
                      required:
                      - name
                      - port
              resources:
                type: object
                description: Resource requests/limits or a preset size name.
                properties:
                  size:
                    type: string
                    description: Preset name from VestaConfig.podSizeList.
                  requests:
                    type: object
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      x-kubernetes-int-or-string: true
                  limits:
                    type: object
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      x-kubernetes-int-or-string: true
              healthCheck:
                type: object
                description: Health check configuration for liveness and readiness
                  probes.
                properties:
                  type:
                    type: string
                    enum:
                    - http
                    - tcp
                    - exec
                    description: Type of health check probe.
                  path:
                    type: string
                    description: HTTP path for http probes.
                  port:
                    type: integer
                    format: int32
                    description: Port for http/tcp probes. Defaults to runtime port.
                  command:
                    type: string
                    description: Command for exec probes.
                  initialDelaySeconds:
                    type: integer
                    format: int32
                    minimum: 0
                  periodSeconds:
                    type: integer
                    format: int32
                    minimum: 1
                  timeoutSeconds:
                    type: integer
                    format: int32
                    minimum: 1
                  failureThreshold:
                    type: integer
                    format: int32
                    minimum: 1
                  successThreshold:
                    type: integer
                    format: int32
                    minimum: 1
                required:
                - type
              ingress:
                type: object
                properties:
                  domain:
                    type: string
                  tls:
                    type: boolean
                    default: true
                  clusterIssuer:
                    type: string
                  ingressClassName:
                    type: string
                  basicAuth:
                    type: boolean
                    default: false
                  annotations:
                    type: object
                    additionalProperties:
                      type: string
                  redirectDomains:
                    type: array
                    description: Domains that 301-redirect to the primary domain.
                      Supports Traefik and NGINX ingress controllers.
                    items:
                      type: string
                  redirectTarget:
