apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vestaprojects.kubernetes.getvesta.sh
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: kubernetes.getvesta.sh
  names:
    kind: VestaProject
    listKind: VestaProjectList
    plural: vestaprojects
    singular: vestaproject
    shortNames:
    - vprj
    - vproj
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Team
      type: string
      jsonPath: .spec.team
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        description: VestaProject groups environments and apps under a single project.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              displayName:
                type: string
                description: Human-readable project name.
              team:
                type: string
                description: Team or owner responsible for this project.
              labels:
                type: object
                description: Custom labels to apply to all app deployments in this
                  project.
                additionalProperties:
                  type: string
              annotations:
                type: object
                description: Custom annotations to apply to all app deployments in
                  this project.
                additionalProperties:
                  type: string
              environments:
                type: array
                description: Environments available in this project.
                items:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
                      description: Environment identifier (e.g., dev, staging, prod).
                    displayName:
                      type: string
                      description: Human-readable environment name.
                    branch:
                      type: string
                      description: Git branch associated with this environment.
                    order:
                      type: integer
                      description: Sort order for display (lower values first).
                    autoDeploy:
                      type: boolean
                      description: Whether to automatically deploy on push to the
                        branch.
                      default: false
                    requireApproval:
                      type: boolean
                      description: Whether deployments require manual approval.
                      default: false
                    autoDeployPRs:
                      type: boolean
                      description: Whether to auto-deploy pull requests.
                      default: false
              defaultGit:
                type: object
                description: Default git configuration inherited by apps.
                x-kubernetes-preserve-unknown-fields: true
                properties:
                  autoDeployOnPush:
                    type: boolean
                  branch:
                    type: string
                  provider:
                    type: string
                  repository:
                    type: string
              defaultBuild:
                type: object
                description: Default build configuration inherited by apps.
                x-kubernetes-preserve-unknown-fields: true
                properties:
                  dockerfile:
                    type: string
                  strategy:
                    enum:
                    - runpacks
                    - buildpacks
                    - dockerfile
                    - nixpacks
                    - image
                    type: string
              defaultImage:
                type: object
                description: Default image configuration inherited by apps.
                x-kubernetes-preserve-unknown-fields: true
                properties:
                  imagePullSecrets:
                    items:
                      description: 'LocalObjectReference contains enough information
                        to let you locate the

                        referenced object inside the same namespace.'
                      properties:
                        name:
                          default: ''
                          description: 'Name of the referent.

                            This field is effectively required, but due to backwards
                            compatibility is

                            allowed to be empty. Instances of this type with an empty
                            value here are

                            almost certainly wrong.

                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names'
                          type: string
                      type: object
                      x-kubernetes-map-type: atomic
                    type: array
                  pullPolicy:
                    description: PullPolicy describes a policy for if/when to pull
                      a container image
                    type: string
                  repository:
                    description: 'Repository is optional because this struct is reused
                      for per-environment overrides,

                      where setting only a tag and inheriting the repository is the
                      normal case. Without

                      omitempty, controller-gen marks it required and the API server
                      rejects every such

                      override -- which the hand-maintained CRDs never did, so existing
                      VestaApps in the

                      wild depend on it staying optional.'
                    type: string
                  tag:
                    type: string
              imagePullSecrets:
                type: array
                description: Image pull secrets available to all apps in this project.
                items:
                  type: object
                  properties:
                    name:
                      type: string
                  required:
                  - name
              notifications:
                type: object
                description: Notification configuration for project events.
                x-kubernetes-preserve-unknown-fields: true
                properties:
                  discord:
                    properties:
                      events:
                        items:
                          type: string
                        type: array
                      webhookUrl:
                        type: string
                    type: object
                  slack:
                    properties:
                      events:
                        items:
                          type: string
                        type: array
                      webhookUrl:
                        type: string
                    type: object
                  webhook:
                    properties:
                      events:
                        items:
                          type: string
                        type: array
                      url:
                        type: string
                    type: object
          status:
            type: object
            properties:
              environmentCount:
                type: integer
              appCount:
                type: integer
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      description: 'observedGeneration represents the .metadata.generation
                        that the condition was set based upon.

                        For instance, if .metadata.generation is currently 12, but
                        the .status.conditions[x].observedGeneration is 9, the condition
                        is out of date

                        with respect to the current state of the instance.'
                      format: int64
                      minimum: 0
                      type: integer
                  required:
                  - type
                  - status
