apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vestaenvironments.kubernetes.getvesta.sh
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: kubernetes.getvesta.sh
  names:
    kind: VestaEnvironment
    listKind: VestaEnvironmentList
    plural: vestaenvironments
    singular: vestaenvironment
    shortNames:
    - ve
    - venv
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    additionalPrinterColumns:
    - name: Project
      type: string
      jsonPath: .spec.project
    - name: Branch
      type: string
      jsonPath: .spec.branch
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        description: VestaEnvironment represents a deployment environment within a
          project.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - project
            properties:
              project:
                type: string
                description: Name of the VestaProject this environment belongs to.
              displayName:
                type: string
                description: Human-readable environment name.
              order:
                type: integer
                description: Sort order for display (lower values first).
              autoDeploy:
                type: boolean
                description: Whether to automatically deploy on push to the branch.
                default: false
              branch:
                type: string
                description: Git branch associated with this environment.
              requireApproval:
                type: boolean
                description: Whether deployments require manual approval.
                default: false
              autoDeployPRs:
                type: boolean
                description: Whether to auto-deploy pull requests into this environment.
                default: false
              quota:
                description: 'Quota bounds what this environment may consume. Empty
                  inherits the project''s, then

                  the platform default.'
                properties:
                  defaultLimitCpu:
                    type: string
                  defaultLimitMemory:
                    type: string
                  defaultRequestCpu:
                    description: 'Defaults for the LimitRange that ships alongside
                      the quota. Once a quota names

                      requests.cpu, Kubernetes requires every new pod to set one;
                      these are what pods that

                      do not get.'
                    type: string
                  defaultRequestMemory:
                    type: string
                  enforce:
                    description: 'Enforce is a pointer so absent is distinguishable
                      from false. Absent means

                      report-only: the controller creates no ResourceQuota at all
                      and only computes what

                      one would do.


                      That default is the whole safety story. A ResourceQuota is not
                      applied retroactively

                      to pods that already exist -- it blocks the NEXT admission,
                      which means the failure

                      lands in the middle of somebody''s deploy rather than when the
                      quota was set. Working

                      out the answer first, and showing it, turns that into a decision.'
                    type: boolean
                  limitsCpu:
                    description: 'Limits are opt-in and sharper than they look: a
                      limits.* quota makes every pod

                      without that limit set unadmittable, and most pods do not set
                      one.'
                    type: string
                  limitsMemory:
                    type: string
                  maxDeployments:
                    format: int32
                    type: integer
                  maxPods:
                    format: int32
                    type: integer
                  maxPvcs:
                    format: int32
                    type: integer
                  maxServices:
                    format: int32
                    type: integer
                  requestsCpu:
                    type: string
                  requestsMemory:
                    type: string
                  storageTotal:
                    type: string
                type: object
          status:
            type: object
            properties:
              appCount:
                type: integer
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string
                    observedGeneration:
                      description: 'observedGeneration represents the .metadata.generation
                        that the condition was set based upon.

                        For instance, if .metadata.generation is currently 12, but
                        the .status.conditions[x].observedGeneration is 9, the condition
                        is out of date

                        with respect to the current state of the instance.'
                      format: int64
                      minimum: 0
                      type: integer
                  required:
                  - type
                  - status
              quota:
                description: Quota reports what the environment is consuming and whether
                  a quota is in force.
                properties:
                  committed:
                    additionalProperties:
                      type: string
                    description: 'Committed is what the environment''s apps add up
                      to at their configured maximum --

                      autoscaling ceilings included, because a quota that fits today''s
                      replicas and not

                      tomorrow''s blocks a scale-up with no warning.'
                    type: object
                  enforced:
                    description: Enforced is whether a ResourceQuota object exists.
                    type: boolean
                  reason:
                    type: string
                  used:
                    additionalProperties:
                      type: string
                    description: Used is what is actually running now.
                    type: object
                  wouldExceed:
                    description: 'WouldExceed is set when the configured quota is
                      below what is already committed.

                      Applying it then would refuse the next deploy, so it is reported
                      instead.'
                    type: boolean
                type: object
              networkIsolation:
                description: 'NetworkIsolation reports whether the environment is
                  actually isolated, which is not

                  the same question as whether isolation was turned on.'
                properties:
                  enabled:
                    type: boolean
                  enforced:
                    description: Enforced is whether this cluster's CNI is believed
                      to implement NetworkPolicy.
                    type: boolean
                  enforcementKnown:
                    description: 'EnforcementKnown distinguishes "we determined it
                      is not enforced" from "we could not

                      tell". Reporting an unknown as "not enforced" would cry wolf
                      on every unrecognised

                      plugin; reporting it as enforced would be the dangerous direction.'
                    type: boolean
                  lastApplied:
                    format: date-time
                    type: string
                  note:
                    type: string
                  policyCount:
                    format: int32
                    type: integer
                  trustedFrom:
                    items:
                      type: string
                    type: array
                type: object
