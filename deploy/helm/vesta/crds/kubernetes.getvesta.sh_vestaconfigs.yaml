apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vestaconfigs.kubernetes.getvesta.sh
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: kubernetes.getvesta.sh
  names:
    kind: VestaConfig
    listKind: VestaConfigList
    plural: vestaconfigs
    singular: vestaconfig
    shortNames:
    - vc
    - vcfg
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        description: VestaConfig is the cluster-wide configuration for the Vesta platform.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - domain
            properties:
              domain:
                type: string
                description: Base domain for app ingress (e.g. apps.example.com).
              domainTemplate:
                type: string
                description: Template for auto-generating per-environment domains.
                  Supports {{app}}, {{env}}, {{domain}} placeholders (e.g. {{app}}-{{env}}.{{domain}}).
              clusterIssuer:
                type: string
                description: cert-manager ClusterIssuer name for TLS certificates.
              ingressClassName:
                type: string
                description: Default Kubernetes IngressClass name (e.g. traefik, nginx).
              registry:
                type: object
                properties:
                  build:
                    type: object
                    description: Registry where Vesta pushes built images.
                    properties:
                      url:
                        type: string
                      credentials:
                        type: object
                        properties:
                          secretRef:
                            type: string
                    required:
                    - url
                  globalImagePullSecrets:
                    type: array
                    description: ImagePullSecrets applied to every app cluster-wide.
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                      required:
                      - name
              podSizeList:
                type: array
                description: Predefined resource presets selectable by name.
                items:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
                    requests:
                      type: object
                      additionalProperties:
                        anyOf:
                        - type: integer
                        - type: string
                        x-kubernetes-int-or-string: true
                    limits:
                      type: object
                      additionalProperties:
                        anyOf:
                        - type: integer
                        - type: string
                        x-kubernetes-int-or-string: true
              autoscaleDefaults:
                type: object
                description: Cluster-wide autoscaling defaults, overridable per app.
                properties:
                  minReplicas:
                    type: integer
                    format: int32
                  maxReplicas:
                    type: integer
                    format: int32
                  targetCPU:
                    type: integer
                    format: int32
                  targetMemory:
                    type: integer
                    format: int32
              buildpacks:
                type: array
                items:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
                    fetchImage:
                      type: string
                    buildCommand:
                      type: string
                    runCommand:
                      type: string
              externalSecrets:
                type: object
                properties:
                  enabled:
                    type: boolean
                  provider:
                    type: string
                  vault:
                    type: object
                    properties:
                      server:
                        type: string
                      path:
                        type: string
                      auth:
                        type: object
                        properties:
                          method:
                            type: string
                          role:
                            type: string
              auth:
                type: object
                properties:
                  local:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                  oauth2:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      providers:
                        type: array
                        items:
                          type: object
                          required:
                          - name
                          - clientId
                          - clientSecret
                          properties:
                            name:
                              type: string
                            clientId:
                              type: string
                            clientSecret:
                              type: string
                            allowedOrgs:
                              type: array
                              items:
                                type: string
                  apiTokens:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      maxTokensPerUser:
                        type: integer
                      defaultExpiry:
                        type: string
              templates:
                type: object
                properties:
                  catalogUrl:
                    type: string
              prometheusUrl:
                type: string
              httpsRedirect:
                description: "HTTPSRedirect decides how an app's HTTP traffic is redirected\
                  \ to HTTPS.\n\n  \"middleware\" (default) stamps a Traefik redirectScheme\
                  \ Middleware per app and\n    references it from the Ingress annotation.\n\
                  \  \"none\" stamps nothing, for clusters whose ingress controller\
                  \ already redirects at\n    the entrypoint -- the standard Traefik\
                  \ chart does this with\n    entryPoints.web.http.redirections, which\
                  \ runs before any router or middleware is\n    consulted, making\
                  \ the per-app middleware pure redundancy.\n\nThe distinction matters\
                  \ beyond tidiness: Traefik drops an entire router when a\nreferenced\
                  \ middleware cannot be resolved, so a redundant middleware is not\
                  \ a no-op,\nit is an extra way for the route to fail."
                enum:
                - middleware
                - none
                type: string
              quotaDefaults:
                description: 'QuotaDefaults apply to every environment that does not
                  set its own. Report-only

                  unless enforce is set, so configuring one here does not silently
                  start refusing

                  deploys across the whole instance.'
                properties:
                  defaultLimitCpu:
                    type: string
                  defaultLimitMemory:
                    type: string
                  defaultRequestCpu:
                    description: 'Defaults for the LimitRange that ships alongside
                      the quota. Once a quota names

                      requests.cpu, Kubernetes requires every new pod to set one;
                      these are what pods that

                      do not get.'
                    type: string
                  defaultRequestMemory:
                    type: string
                  enforce:
                    description: 'Enforce is a pointer so absent is distinguishable
                      from false. Absent means

                      report-only: the controller creates no ResourceQuota at all
                      and only computes what

                      one would do.


                      That default is the whole safety story. A ResourceQuota is not
                      applied retroactively

                      to pods that already exist -- it blocks the NEXT admission,
                      which means the failure

                      lands in the middle of somebody''s deploy rather than when the
                      quota was set. Working

                      out the answer first, and showing it, turns that into a decision.'
                    type: boolean
                  limitsCpu:
                    description: 'Limits are opt-in and sharper than they look: a
                      limits.* quota makes every pod

                      without that limit set unadmittable, and most pods do not set
                      one.'
                    type: string
                  limitsMemory:
                    type: string
                  maxDeployments:
                    format: int32
                    type: integer
                  maxPods:
                    format: int32
                    type: integer
                  maxPvcs:
                    format: int32
                    type: integer
                  maxServices:
                    format: int32
                    type: integer
                  requestsCpu:
                    type: string
                  requestsMemory:
                    type: string
                  storageTotal:
                    type: string
                type: object
              cost:
                description: 'Cost prices what workloads reserve. Without it Vesta
                  uses a documented default

                  derived from one commodity node, which is an estimate and says so.'
                properties:
                  cpuCoreHour:
                    type: number
                  currency:
                    type: string
                  memoryGiBHour:
                    type: number
                  nodeMemoryGiB:
                    type: number
                  nodeMonthlyCost:
                    type: number
                  nodeVCPUs:
                    type: number
                  storageGiBMonth:
                    type: number
                type: object
              security:
                description: 'Security hardens what apps run as, and whether environments
                  can reach each other.

                  Absent, nothing changes: the default profile sets no security context
                  at all, which

                  is what every existing app already runs with.'
                properties:
                  networkIsolation:
                    description: NetworkIsolation keeps environments from reaching
                      each other.
                    properties:
                      enabled:
                        type: boolean
                      metricsPort:
                        description: 'MetricsPort, when set, stays reachable from
                          anywhere. A scraper that cannot be located

                          by namespace is common, and a closed metrics port fails
                          silently -- the dashboard just

                          goes blank.'
                        format: int32
                        type: integer
                      trustedNamespaceLabels:
                        additionalProperties:
                          type: string
                        description: 'TrustedNamespaceLabels is for clusters that
                          label namespaces by purpose rather than

                          naming them predictably.'
                        type: object
                      trustedNamespaces:
                        description: 'TrustedNamespaces may reach apps. Left empty,
                          a default list covering the usual

                          ingress-controller and monitoring namespaces is used; setting
                          it REPLACES that list

                          rather than adding to it.'
                        items:
                          type: string
                        type: array
                    type: object
                  profile:
                    description: "Profile is the default pod hardening for every app\
                      \ that does not name its own.\n\n  \"legacy\" (the default)\
                      \ sets no security context, which is what every app running\n\
                      \    today already has. Changing this default would alter the\
                      \ behaviour of running\n    workloads on upgrade, so it does\
                      \ not change.\n  \"baseline\" forbids privilege escalation,\
                      \ drops all capabilities and applies the\n    runtime's default\
                      \ seccomp filter. Safe to turn on across an instance.\n  \"\
                      restricted\" adds a non-root user and a read-only root filesystem.\
                      \ Not safe to turn\n    on blindly -- images that write to their\
                      \ own filesystem will break -- so it is\n    best set per app."
                    enum:
                    - legacy
                    - baseline
                    - restricted
                    type: string
                  defaultSecretScope:
                    description: 'DefaultSecretScope is the scope given to a secret
                      created without one.


                      "global" is the default and the backwards-compatible answer.
                      Setting "project" makes

                      new secrets private to their project; it does NOT reclassify
                      existing ones, because

                      silently narrowing access to a credential an app already pulls
                      with would break that

                      app''s deploys with nothing to point at.'
                    enum:
                    - global
                    - project
                    type: string
                type: object
